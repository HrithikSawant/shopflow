services:

  postgres:
    image: postgres:17
    container_name: shopflow-postgres
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports:
      - "5432:5432"
    volumes:
      # Runs *.sql in order, only on a FRESH data directory.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 matters: during first-time init Postgres runs a temporary
      # server that only listens on the unix socket, so a socket check would
      # report "ready" before the migrations have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopflow -d shopflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shopflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgres://shopflow:shopflow@postgres:5432/shopflow
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
