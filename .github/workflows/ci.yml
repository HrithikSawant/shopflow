name: ci

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: apps/${{ matrix.app }}/go.sum
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./... -race -count=1

  # Uses the same docker-compose stack as local development, with passwords
  # generated fresh for every run: no credential is stored in the repository
  # or in GitHub secrets, and the values are masked in the logs.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/gen-env.sh
      - name: Start Postgres + RabbitMQ (migrations run on first start)
        run: docker compose up -d --wait postgres rabbitmq
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/worker/go.sum
      - name: Integration tests
        run: make test-integration
      - if: failure()
        run: docker compose logs postgres rabbitmq
      - if: always()
        run: docker compose down -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/gen-env.sh
      - run: docker compose up --build -d --wait
      - run: bash tests/smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
